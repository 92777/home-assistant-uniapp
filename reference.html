<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>智慧家居 · 毛玻璃UI</title>
  <!-- Font Awesome 6 (免费图标库, 用于科技感图标) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0b14;  /* 深色基底 */
      padding: 12px;
    }

    /* 模拟手机容器，更直观感受app界面 */
    .phone-frame {
      width: 375px;           /* 典型手机宽度 */
      max-width: 100%;
      height: 730px;
      background: transparent;
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.05) inset;
      position: relative;
    }

    /* 主界面滚动区域 */
    .app-screen {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 18px 24px 18px;
      scrollbar-width: none;   /* 隐藏滚动条保持干净 */
      -ms-overflow-style: none;
      background: transparent; /* 背景由下面的body背景决定，但毛玻璃需要父级背景 */
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .app-screen::-webkit-scrollbar {
      display: none;
    }

    /* ---------- 科技感 + 温馨感 背景 ---------- */
    /* 深色渐变基底 + 暖色光晕 (模糊的大圆点) 营造温馨氛围 */
    .phone-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(180, 130, 255, 0.4) 0%, transparent 45%),
                  radial-gradient(circle at 90% 70%, rgba(255, 160, 100, 0.45) 0%, transparent 55%),
                  radial-gradient(circle at 40% 80%, rgba(70, 200, 220, 0.3) 0%, transparent 50%),
                  linear-gradient(145deg, #12121c 0%, #1e1a2a 100%);
      background-blend-mode: overlay;
      z-index: 1;
    }

    /* 增加微妙的网格线，强化科技感 */
    .phone-frame::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(150, 220, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(150, 220, 255, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 1;
    }

    /* ----- 所有毛玻璃卡片的基础样式 ----- */
    .glass-card {
      background: rgba(25, 25, 35, 0.35);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
      padding: 16px 18px;
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 40px rgba(0, 0, 0, 0.5);
    }

    /* 更小的毛玻璃卡片（比如场景胶囊） */
    .glass-chip {
      background: rgba(30, 30, 42, 0.4);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      color: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    /* 顶部状态栏 (非毛玻璃，但半透明) */
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 4px 6px 0px 6px;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.2px;
      margin-bottom: 4px;
      background: transparent;
    }

    /* 主头部 */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .main-header h1 {
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff, #ffe6c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(255, 200, 150, 0.3);
    }
    .header-actions {
      display: flex;
      gap: 18px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 20px;
    }
    .header-actions i {
      background: rgba(255,255,255,0.1);
      padding: 8px;
      border-radius: 50%;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.15);
      transition: 0.2s;
    }

    /* 搜索条 */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.7);
      font-size: 16px;
    }
    .search-bar i {
      font-size: 18px;
      opacity: 0.8;
    }
    .search-bar span {
      flex: 1;
    }

    /* 快捷场景 (水平滑动模拟) */
    .scene-section {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 0 8px 0;
      scrollbar-width: none;
    }
    .scene-section::-webkit-scrollbar {
      display: none;
    }
    .scene-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
      background: rgba(30, 30, 42, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      gap: 4px;
    }
    .scene-chip i {
      font-size: 22px;
      color: #ffcfa2; /* 温馨的暖光色 */
      filter: drop-shadow(0 0 6px #ffae6d);
    }
    .scene-chip span {
      font-weight: 400;
    }

    /* 设备区域标题 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .section-header h2 {
      font-size: 20px;
      font-weight: 600;
      color: white;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
      letter-spacing: -0.3px;
    }
    .section-header a {
      color: rgba(255, 215, 170, 0.9);
      font-size: 15px;
      text-decoration: none;
      font-weight: 500;
      background: rgba(255,255,255,0.06);
      padding: 6px 12px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* 设备网格 2x2 */
    .device-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* 卡片内部细节 */
    .device-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .device-icon {
      width: 44px;
      height: 44px;
      border-radius: 28px;
      background: rgba(255, 165, 100, 0.2);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 1px solid rgba(255, 200, 150, 0.4);
      color: #ffc89c;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }
    .device-info h4 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .device-info p {
      font-size: 13px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-badge {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      border-radius: 30px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #b9ffb9;
    }
    .status-badge.off {
      color: #ffb4b4;
    }

    /* 进度条 (用于灯光亮度、窗帘、电量) */
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      margin: 12px 0 6px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #febf8e, #ff8e9f);
      width: 60%; /* demo数值 */
      box-shadow: 0 0 10px #ffb272;
    }
    .progress-fill.green {
      background: linear-gradient(90deg, #a4e0a0, #62c97c);
      box-shadow: 0 0 8px #94f0a0;
    }
    .progress-fill.blue {
      background: linear-gradient(90deg, #8ac4ff, #5b8cff);
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
    }
    .card-row i {
      font-size: 14px;
      opacity: 0.7;
    }

    /* 底部导航毛玻璃 */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(20, 20, 30, 0.4);
      backdrop-filter: blur(18px) saturate(200%);
      -webkit-backdrop-filter: blur(18px) saturate(200%);
      border-radius: 42px;
      padding: 10px 14px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      transition: 0.2s;
    }
    .nav-item i {
      font-size: 22px;
      margin-bottom: 4px;
    }
    .nav-item.active {
      color: #ffc285;
      text-shadow: 0 0 8px #ffae5e;
    }

    /* 个别调整 */
    .temperature-big {
      font-size: 26px;
      font-weight: 600;
      background: linear-gradient(135deg, #fff, #ffdbb5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .unit {
      font-size: 14px;
      opacity: 0.7;
    }

    /* 温馨的点缀: 暖色图标 */
    .warm-accent {
      color: #ffbc7c;
    }
    .small-note {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 模拟湿度/温度小卡片 */
    .climate-stats {
      display: flex;
      gap: 20px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="app-screen">
      <!-- 状态栏 轻量透明 -->
      <div class="status-bar">
        <span>9:41</span>
        <span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span>
      </div>

      <!-- 主头部 科技温馨感 -->
      <div class="main-header">
        <h1>智慧·家</h1>
        <div class="header-actions">
          <i class="fa-regular fa-bell"></i>
          <i class="fa-regular fa-circle-user"></i>
        </div>
      </div>

      <!-- 天气/问候 毛玻璃卡片 小巧显示温馨 -->
      <div class="glass-card" style="padding: 16px 18px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-size: 15px; opacity:0.9;">晚上好, 一舟 🌙</div>
            <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 6px;">
              <span class="temperature-big">22°</span>
              <span style="font-size: 14px;">室内 · 舒适</span>
            </div>
          </div>
          <div style="text-align: right;">
            <i class="fa-solid fa-cloud-moon" style="font-size: 32px; color: #c7dcff; filter: drop-shadow(0 0 8px #94b5ff);"></i>
            <div style="font-size: 13px; opacity:0.7;">多云 18°</div>
          </div>
        </div>
        <div class="climate-stats">
          <span><i class="fa-regular fa-droplet warm-accent"></i> 湿度 48%</span>
          <span><i class="fa-regular fa-wind warm-accent"></i> 优 22</span>
        </div>
      </div>

      <!-- 搜索条 毛玻璃 -->
      <div class="search-bar glass-card" style="padding: 14px 18px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>灯光、空调或场景...</span>
        <i class="fa-solid fa-microphone" style="opacity:0.9; color: #ffbd87;"></i>
      </div>

      <!-- 快捷场景 水平滚动 带毛玻璃 -->
      <div class="scene-section">
        <div class="scene-chip"><i class="fa-solid fa-house"></i><span>离家</span></div>
        <div class="scene-chip"><i class="fa-solid fa-person-walking"></i><span>回家</span></div>
        <div class="scene-chip"><i class="fa-solid fa-moon"></i><span>睡眠</span></div>
        <div class="scene-chip"><i class="fa-solid fa-film"></i><span>观影</span></div>
        <div class="scene-chip"><i class="fa-solid fa-mug-saucer"></i><span>早餐</span></div>
      </div>

      <!-- 设备区域标题 + 查看全部 -->
      <div class="section-header">
        <h2>常用设备</h2>
        <a href="#">全部 <i class="fa-regular fa-arrow-right" style="font-size: 11px;"></i></a>
      </div>

      <!-- 设备网格 2x2 毛玻璃卡片 -->
      <div class="device-grid">
        <!-- 卡片1: 客厅灯光 (暖光) -->
        <div class="glass-card" style="padding: 18px 14px;">
          <div class="device-card-header">
            <div class="device-icon"><i class="fa-regular fa-lightbulb"></i></div>
            <div class="device-info">
              <h4>客厅灯</h4>
              <p><i class="fa-regular fa-circle-check" style="color: #a7e0a0;"></i> 已开启</p>
            </div>
            <div class="status-badge">ON</div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: 75%;"></div>
          </div>
          <div class="card-row">
            <span><i class="fa-regular fa-sun"></i> 亮度 75%</span>
            <i class="fa-regular fa-sliders"></i>
          </div>
        </div>

        <!-- 卡片2: 卧室空调 (制冷) -->
        <div class="glass-card" style="padding: 18px 14px;">
          <div class="device-card-header">
            <div class="device-icon" style="background: rgba(90, 180, 255, 0.2); color: #9ac9ff;"><i class="fa-regular fa-snowflake"></i></div>
            <div class="device-info">
              <h4>卧室空调</h4>
              <p><i class="fa-regular fa-fan"></i> 制冷</p>
            </div>
            <div class="status-badge">23°C</div>
          </div>
          <div class="card-row" style="margin-top: 12px;">
            <span>风速 中</span>
            <span>扫风 <i class="fa-regular fa-arrow-right-arrow-left"></i></span>
          </div>
          <div class="small-note" style="margin-top: 12px;">
            <i class="fa-regular fa-clock"></i> 定时 2h
          </div>
        </div>

        <!-- 卡片3: 智能窗帘 (温馨半开) -->
        <div class="glass-card" style="padding: 18px 14px;">
          <div class="device-card-header">
            <div class="device-icon" style="background: rgba(200, 150, 255, 0.2); color: #d7b0ff;"><i class="fa-regular fa-curtain"></i></div>
            <div class="device-info">
              <h4>智能窗帘</h4>
              <p>客厅 · 开合度</p>
            </div>
            <div class="status-badge">45%</div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill blue" style="width: 45%;"></div>
          </div>
          <div class="card-row">
            <span><i class="fa-regular fa-sun"></i> 透光 45%</span>
            <i class="fa-regular fa-pause"></i>
          </div>
        </div>

        <!-- 卡片4: 门锁 + 电量 (安全感) -->
        <div class="glass-card" style="padding: 18px 14px;">
          <div class="device-card-header">
            <div class="device-icon" style="background: rgba(180, 220, 150, 0.2); color: #bcf5a3;"><i class="fa-regular fa-lock"></i></div>
            <div class="device-info">
              <h4>大门锁</h4>
              <p><i class="fa-regular fa-shield-check"></i> 已上锁</p>
            </div>
            <div class="status-badge off">🔒</div>
          </div>
          <div class="card-row" style="margin-bottom: 4px;">
            <span>电池电量</span>
            <span>100% <i class="fa-regular fa-battery-full"></i></span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill green" style="width: 100%;"></div>
          </div>
          <div class="small-note" style="margin-top: 8px;">
            <i class="fa-regular fa-clock"></i> 上次开启 08:30
          </div>
        </div>
      </div>

      <!-- 快捷场景/推荐场景 (又一个毛玻璃卡片 体现氛围) -->
      <div class="glass-card" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 16px 20px;">
        <div>
          <span style="font-size: 16px; font-weight: 600;">阅读模式</span>
          <div style="font-size: 13px; opacity:0.7;">灯光变暖 · 窗帘关闭</div>
        </div>
        <div style="display: flex; gap: 10px;">
          <i class="fa-regular fa-book-open" style="font-size: 24px; color: #ffe2ac;"></i>
          <i class="fa-regular fa-circle-play" style="font-size: 28px; color: #ffba7a;"></i>
        </div>
      </div>

      <!-- 底部导航 毛玻璃 -->
      <div class="bottom-nav">
        <div class="nav-item active"><i class="fa-regular fa-house"></i><span>首页</span></div>
        <div class="nav-item"><i class="fa-regular fa-compass"></i><span>场景</span></div>
        <div class="nav-item"><i class="fa-regular fa-microchip"></i><span>设备</span></div>
        <div class="nav-item"><i class="fa-regular fa-user"></i><span>我的</span></div>
      </div>

      <!-- 底部留白 -->
      <div style="height: 8px;"></div>
    </div>
  </div>

  <!-- 说明：毛玻璃效果通过 backdrop-filter 实现，背景为深色渐变+暖色光晕，UI同时体现科技线条与温馨光感 -->
</body>
</html>
